# ynr's telemetry registry: the names ynr itself writes, under the ynr. prefix, as an OpenTelemetry
# Weaver registry (ADR-007). Other tools' names are in their own registries. It is embedded in the
# binary and printed by `ynr telemetry registry --format json`; internal/names/names.go is
# generated from it (`go generate ./...`).
file_format: definition_manifest/2.0
name: ynr
description: The names ynr writes, under the ynr. prefix, and the OpenTelemetry names it uses beside them.
schema_url: https://github.com/eyelock/ynr/telemetry/schemas/0.1.0
dependencies:
  # The upstream semantic conventions ynr follows. Moving this is a deliberate change.
  - name: otel
    schema_url: https://opentelemetry.io/schemas/1.40.0
    registry_path: https://github.com/open-telemetry/semantic-conventions/archive/refs/tags/v1.40.0.zip[model]
