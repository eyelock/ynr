name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  # A push to main or develop gets a group of its own, keyed on the commit, so no push run is
  # replaced: GitHub keeps one waiting run per group, and a shared group let a third quick merge
  # replace the second's run before it started, hiding a red develop. A pull request run keeps
  # the ref's group, and a newer pull-request run cancels the older one.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  # A run that has started on develop or main always finishes: cancelling it by the next merge hid
  # a red develop until too late.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spoolexporter/js/package-lock.json
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: make check
        run: make check
      - name: build
        run: make build && ./bin/ynr version
  # The S3 adapter and the queries over it are tested against a real S3 server. MinIO publishes
  # no free binaries or images, so it is built from source at a pinned release and cached.
  s3:
    runs-on: ubuntu-latest
    env:
      MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: cache minio
        id: minio-cache
        uses: actions/cache@v6
        with:
          path: ~/minio-bin
          key: minio-${{ env.MINIO_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: build minio
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio-bin" GOTOOLCHAIN=auto go install github.com/minio/minio@${MINIO_VERSION}
      - name: start minio
        env:
          MINIO_ROOT_USER: ynrtest
          MINIO_ROOT_PASSWORD: ynrtestsecret
        run: |
          mkdir -p "$HOME/minio-data"
          "$HOME/minio-bin/minio" server "$HOME/minio-data" --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 > "$HOME/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          cat "$HOME/minio.log"
          exit 1
      - name: store and query tests against s3
        env:
          YNR_TEST_S3: s3://ynr-test?region=us-east-1&endpoint=http://127.0.0.1:9000&path_style=true
          AWS_ACCESS_KEY_ID: ynrtest
          AWS_SECRET_ACCESS_KEY: ynrtestsecret
        run: go test -tags full -race ./internal/store ./internal/query

  # The one check the branch rulesets require. It runs even when a job it needs failed (always()),
  # because a skipped required check counts as passing.
  all-clear:
    name: All Clear
    runs-on: ubuntu-latest
    needs: [check, s3]
    if: always()
    steps:
      - name: check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
