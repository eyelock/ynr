name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spoolexporter/js/package-lock.json
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - name: make check
        run: make check
      - name: build
        run: make build && ./bin/ynr version
