name: release
# Releases ynr from a v* tag on main: binaries for darwin and linux, a signed checksum file,
# SBOMs, and the formula in eyelock/homebrew-tap. spoolexporter/v* tags publish the exporters
# instead (publish-spoolexporter.yml).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  # Keyless cosign signing exchanges this for a short-lived certificate bound to this workflow.
  id-token: write
jobs:
  check:
    name: make check (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spoolexporter/js/package-lock.json
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - run: make check

  release:
    name: Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Writes the release here and the formula to eyelock/homebrew-tap.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
