name: release
# Releases ynr from a v* tag on main: binaries for darwin and linux, a signed checksum file,
# SBOMs, and the formula in eyelock/homebrew-tap. spoolexporter/v* tags publish the exporters
# instead (publish-spoolexporter.yml).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  # Keyless cosign signing exchanges this for a short-lived certificate bound to this workflow.
  id-token: write
env:
  GOPRIVATE: github.com/eyelock/ynr
jobs:
  check:
    name: make check (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: let go read this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/eyelock/ynr".insteadOf "https://github.com/eyelock/ynr"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spoolexporter/js/package-lock.json
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - run: make check

  release:
    name: Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: let go read this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/eyelock/ynr".insteadOf "https://github.com/eyelock/ynr"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # The release here is written with this workflow's own token (contents: write).
          GITHUB_TOKEN: ${{ github.token }}
          # RELEASE_TOKEN can write only eyelock/homebrew-tap, for the formula.
          HOMEBREW_TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}
