version: 2

project_name: ynr

before:
  hooks:
    - go test ./...

git:
  # The spool exporter's own releases, spoolexporter/v*, share this repository; only v* tags
  # release ynr.
  ignore_tags:
    - "spoolexporter/*"

builds:
  # The slim build (ADR-001): no cgo, for ynh's base image and every run and factory job. Its
  # archives keep the names (ynr_<version>_<os>_<arch>) that ynh and ynf download.
  - id: ynr
    main: ./cmd/ynr
    binary: ynr
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/eyelock/ynr.Version={{.Version}}
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  # The full build (ADR-001): DuckDB, so `query`, `central` and `--ui`. This is the one Homebrew
  # installs. DuckDB comes as prebuilt static libraries per platform (go.duckdb.org/libduckdb), so
  # cgo needs only a C/C++ compiler for each target. The release runs on a macOS runner: clang
  # builds both darwin arches natively, and the linux arches use the cross toolchains the release
  # workflow puts on the PATH (x86_64-unknown-linux-gnu-g++ and aarch64-unknown-linux-gnu-g++).
  # zig cc cannot do it: the static libraries need libstdc++, which zig does not ship.
  - id: ynr-full
    main: ./cmd/ynr
    binary: ynr
    flags: [-trimpath]
    tags: [full]
    ldflags:
      - -s -w -X github.com/eyelock/ynr.Version={{.Version}}
    env:
      - CGO_ENABLED=1
      - GOWORK=off
      - >-
        CC={{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-unknown-linux-gnu-gcc{{ else if eq .Arch "amd64" }}clang -arch x86_64{{ else }}clang -arch arm64{{ end }}
      - >-
        CXX={{ if eq .Os "linux" }}{{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}-unknown-linux-gnu-g++{{ else if eq .Arch "amd64" }}clang++ -arch x86_64{{ else }}clang++ -arch arm64{{ end }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  # The stub vendor (ADR-008): a deterministic stand-in for a vendor CLI, which a tool's CI puts
  # on the PATH beside ynr for `ynr conformance`. Slim too: no cgo, no DuckDB.
  - id: ynr-stub-vendor
    main: ./cmd/ynr-stub-vendor
    binary: ynr-stub-vendor
    flags: [-trimpath]
    ldflags: [-s -w]
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: ynr
    ids: [ynr]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

  # The full build, under its own name so the slim archives above keep theirs.
  - id: ynr-full
    ids: [ynr-full]
    formats: [tar.gz]
    name_template: "ynr-full_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

  - id: ynr-stub-vendor
    ids: [ynr-stub-vendor]
    formats: [tar.gz]
    name_template: "ynr-stub-vendor_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

# Keyless signing of the checksum file, as ynh and ynf do. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/eyelock/ynr/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

brews:
  # Installs the full build (ADR-001).
  - ids: [ynr-full]
    repository:
      owner: eyelock
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/eyelock/ynr"
    description: "Your named reporting: the observation plane for the ynh, ynm and ynf factory"
    license: "MIT"
    test: |
      system "#{bin}/ynr", "version"
    install: |
      bin.install "ynr"
