version: 2

project_name: ynr

before:
  hooks:
    - go test ./...

git:
  # The spool exporter's own releases, spoolexporter/v*, share this repository; only v* tags
  # release ynr.
  ignore_tags:
    - "spoolexporter/*"

builds:
  # The slim build (ADR-001): no cgo, for laptops and for images.
  - id: ynr
    main: ./cmd/ynr
    binary: ynr
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/eyelock/ynr.Version={{.Version}}
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: ynr
    ids: [ynr]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

# Keyless signing of the checksum file, as ynh and ynf do. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/eyelock/ynr/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

brews:
  - repository:
      owner: eyelock
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/eyelock/ynr"
    description: "Your named reporting: the observation plane for the ynh, ynm and ynf factory"
    license: "MIT"
    # ynr's repository is private for now: the release assets need a token. Homebrew sends this
    # header with the download; export HOMEBREW_GITHUB_API_TOKEN before installing.
    url_headers:
      - "Accept: application/octet-stream"
      - 'Authorization: bearer #{ENV["HOMEBREW_GITHUB_API_TOKEN"]}'
    test: |
      system "#{bin}/ynr", "version"
    install: |
      bin.install "ynr"
